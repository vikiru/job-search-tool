commit-msg:
  jobs:
    - name: Validate commit message with commitlint
      run: pnpm exec commitlint --edit $1

pre-commit:
  parallel: false
  jobs:
    - name: Format staged files with oxfmt
      glob: '*.{js,mjs,cjs,ts,jsx,tsx,json,css,md}'
      run: pnpm format {staged_files}
      stage_fixed: true

    - name: Lint staged files with oxlint
      glob: '*.{js,mjs,cjs,ts,jsx,tsx}'
      run: pnpm lint {staged_files}

pre-push:
  parallel: false
  jobs:
    - name: TypeScript 7 verification
      run: pnpm typecheck
